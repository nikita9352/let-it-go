name: Deploy Let It Go

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check browser logic
        run: |
          node checks/ai.test.cjs
          node checks/ai-loader.test.cjs
          node checks/pdf-only.test.cjs
          node checks/mobile.test.cjs
          python3 -m unittest discover -s checks -p '*_test.py'
      - name: Prepare static site with AI model
        run: python3 scripts/prepare_site.py
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
